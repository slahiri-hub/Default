<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toki Pona ⇄ English Translator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <h1>toki pona <span class="arrow">⇄</span> English</h1>
    <p class="tagline">A free, offline, rule-based translator. No data ever leaves your browser's request to this server.</p>
  </header>

  <main class="translator" id="app">
    <div class="lang-bar">
      <button type="button" class="lang-btn" id="lang-left" data-lang="en-tp" aria-pressed="true">English</button>
      <button type="button" class="swap-btn" id="swap-btn" title="Swap languages" aria-label="Swap languages">⇄</button>
      <button type="button" class="lang-btn" id="lang-right" data-lang="tp-en">toki pona</button>
      <label class="auto-toggle">
        <input type="checkbox" id="auto-detect" checked>
        Auto-detect
      </label>
    </div>

    <div class="panes">
      <div class="pane">
        <textarea id="input-text" placeholder="Type English or toki pona here..." autofocus></textarea>
        <div class="pane-footer">
          <span id="input-count">0</span>/2000
          <button type="button" id="clear-btn" class="text-btn">Clear</button>
        </div>
      </div>

      <div class="pane">
        <div id="output-text" class="output" aria-live="polite"></div>
        <div class="pane-footer">
          <button type="button" id="copy-btn" class="text-btn">Copy</button>
        </div>
      </div>
    </div>

    <div id="note" class="note" hidden></div>

    <div id="alternates" class="alternates" hidden>
      <h2>Other readings</h2>
      <ul id="alternates-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <p>Built with a hand-written particle-grammar parser &amp; compiler &mdash; no AI calls at translation time.</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
